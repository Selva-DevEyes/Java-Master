<!doctype html><html><head><meta charset="utf-8"><title>Width QA</title></head><body><pre id="results">running</pre><script>
const widths=[1920,1440,1024,768,480,360],results=[];let loaded=0;widths.forEach(width=>{const frame=document.createElement('iframe');frame.style.width=`${width}px`;frame.style.height='800px';frame.src=`roasters.html?width=${width}`;frame.onload=()=>{const root=frame.contentDocument.documentElement;results.push({width,clientWidth:root.clientWidth,scrollWidth:root.scrollWidth,overflow:root.scrollWidth>root.clientWidth});loaded++;if(loaded===widths.length)document.querySelector('#results').textContent=JSON.stringify(results.sort((a,b)=>b.width-a.width),null,2);};document.body.append(frame);});
</script></body></html>
